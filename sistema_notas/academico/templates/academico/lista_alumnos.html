<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de alumnos</title>
</head>
<body>
    
    <h1>Lista de Alumnos</h1>

    <ul>
        {% for alumno in alumnos %}

            <li>
                {{ alumno.codigo }} -
                {{ alumno.nombre }} -
                {{ alumno.correo }}
            </li>

        {% endfor %}
    </ul>

    <a href="{% url 'crear_alumno' %}">
        Registrar Nuevo Alumno
    </a>
    
</body>
</html>
