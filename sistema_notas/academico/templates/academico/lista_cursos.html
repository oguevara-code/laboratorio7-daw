<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Cursos</title>
</head>
<body>
    
    <h1>Lista de Cursos</h1>

    <ul>
        {% for curso in cursos %}

            <li>
                {{ curso.codigo }} -
                {{ curso.nombre }} -
                {{ curso.creditos }} créditos
            </li>

        {% endfor %}
    </ul>

    <a href="{% url 'crear_curso' %}">
        Registrar Nuevo Curso
    </a>

</body>
</html>
